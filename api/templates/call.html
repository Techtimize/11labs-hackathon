<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuthRelay provider line (synthetic)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:48px auto;padding:0 16px}
  button{font-size:16px;padding:10px 18px}
  #status{margin-top:14px;color:#555}
</style>
</head>
<body>
<h1>Provider pre-authorisation line</h1>
<p>Synthetic demo. You are speaking with the insurer's AI assistant; qualified employees make every decision.</p>

<button id="start">Start call</button>
<button id="end" disabled>End call</button>
<div id="status">Idle</div>

<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";

let conv;
const $ = (id) => document.getElementById(id);

// Issued when this page was served; /session/signed-url will not mint without it.
const PAGE_TOKEN = {{ page_token | tojson }};

$("start").onclick = async () => {
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const r = await fetch("/session/signed-url", { headers: { "X-Page-Token": PAGE_TOKEN } });
    if (r.status === 401) throw new Error("This page has expired. Reload and try again.");
    if (r.status === 429) throw new Error("Too many attempts. Wait a moment and try again.");
    if (!r.ok) throw new Error("Could not open a session. Try again.");
    const { signed_url } = await r.json();
    conv = await Conversation.startSession({
      signedUrl: signed_url,
      onStatusChange: (s) => { $("status").textContent = s.status; },
      onError: (e) => { $("status").textContent = "Error: " + e; },
    });
    $("start").disabled = true;
    $("end").disabled = false;
  } catch (e) {
    $("status").textContent = e.message;
  }
};

$("end").onclick = async () => {
  await conv?.endSession();
  $("start").disabled = false;
  $("end").disabled = true;
};
</script>
</body>
</html>
