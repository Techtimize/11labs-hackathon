<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuthRelay reviewer queue</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;max-width:960px;margin:32px auto;padding:0 16px}
  table{border-collapse:collapse;width:100%}
  td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}
  .t2{color:#b3372d;font-weight:600}
</style>
</head>
<body>
<h1>Reviewer queue</h1>
<p>
  <label>Reviewer token <input id="tok" type="password"></label>
  <label>Name <input id="who"></label>
  <button id="load">Load queue</button>
</p>
<div id="msg"></div>

<table>
  <thead>
    <tr><th>Review</th><th>Request</th><th>Tier</th><th>Summary and blockers</th><th>Transcript</th><th>Decision</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
const h = () => ({
  "Authorization": "Bearer " + document.getElementById("tok").value,
  "Content-Type": "application/json",
});

// Rows are built with the DOM, never by string interpolation. The summary is written
// by the agent from what a caller said, so treating it as markup would let a caller
// run script on the page where the reviewer token is typed.
function cell(row, text, className) {
  const td = row.insertCell();
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

function decisionCell(row, item) {
  const td = row.insertCell();
  for (const d of ["approve", "deny", "request_more"]) {
    const b = document.createElement("button");
    b.textContent = d.replace("_", " ");
    b.disabled = !item.transcript_ready;
    b.addEventListener("click", () => decide(item.review_ref, d));
    td.append(b, " ");
  }
}

async function load() {
  const r = await fetch("/review/queue", { headers: h() });
  const tbody = document.getElementById("rows");
  tbody.replaceChildren();
  if (!r.ok) { document.getElementById("msg").textContent = "Token rejected."; return; }
  const items = await r.json();

  if (!items.length) {
    const td = tbody.insertRow().insertCell();
    td.colSpan = 6;
    td.textContent = "No items waiting for review.";
    return;
  }

  for (const i of items) {
    const rep = JSON.parse(i.report_json);
    const row = tbody.insertRow();
    cell(row, i.review_ref);
    cell(row, i.request_ref);
    cell(row, i.tier, i.tier.startsWith("tier_2") ? "t2" : "");

    const summary = cell(row, i.summary);
    const blockers = document.createElement("small");
    blockers.textContent = rep.blockers.map(b => `${b.detail} [${b.rule_id}]`).join(" · ") || "None open";
    summary.append(document.createElement("br"), blockers);

    cell(row, i.transcript_ready ? "Stored" : "Waiting");
    decisionCell(row, i);
  }
}

async function decide(ref, d) {
  const r = await fetch(`/review/${ref}/decision`, {
    method: "POST", headers: h(),
    body: JSON.stringify({ decision: d, reviewer: document.getElementById("who").value || "reviewer" }),
  });
  document.getElementById("msg").textContent = r.ok
    ? `Recorded ${d} for ${ref}.`
    : `Not recorded: ${(await r.json()).detail}`;
  load();
}

document.getElementById("load").onclick = load;
</script>
</body>
</html>
