<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuthRelay reviewer queue</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d6b58'/%3E%3Ccircle cx='11' cy='16' r='3' fill='white'/%3E%3Cpath d='M17 11a7 7 0 0 1 0 10' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M21.5 7.5a12 12 0 0 1 0 17' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' opacity='.55'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f7f8; --surface:#fff; --text:#15191e; --muted:#5d6672; --line:#e2e6ea;
    --accent:#1d6b58; --accent-ink:#fff; --accent-soft:#e2f0eb;
    --danger:#b3372d; --danger-soft:#fbe8e6; --warn:#8a5d00; --warn-soft:#fdf2d5;
    --info:#2a55b8; --info-soft:#e7edfb;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.06);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --bar:62px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1114; --surface:#161a1f; --text:#e7eaee; --muted:#9aa3ae; --line:#262c33;
    --accent:#3fb591; --accent-ink:#06130f; --accent-soft:#15302a;
    --danger:#f0766c; --danger-soft:#3a1d1a; --warn:#e5b84b; --warn-soft:#332a10;
    --info:#86a8ff; --info-soft:#1a2440; --shadow:none;
  }}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  .bar{height:var(--bar);display:flex;align-items:center;gap:20px;padding:0 20px;
       border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px}
  .logo{width:28px;height:28px;display:block;flex:none}
  nav{display:flex;gap:4px}
  nav a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14px}
  nav a:hover{background:var(--bg);color:var(--text)}
  nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
          display:grid;place-items:center;font-weight:700;font-size:12px}
  input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);
               border-radius:10px;padding:9px 12px;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{font:inherit;font-weight:600;border-radius:999px;padding:10px 20px;cursor:pointer;
       border:1px solid transparent;transition:filter .15s,background .15s}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.primary:not(:disabled):hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.danger-ghost{background:transparent;color:var(--danger);border-color:var(--line)}
  .btn.small{padding:6px 14px;font-size:13px}

  .page{max-width:1280px;margin:0 auto;padding:24px 24px 120px}
  h1{margin:0;font-size:24px}
  .sub{color:var(--muted);font-size:13px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:var(--shadow)}

  /* ---- list view ---- */
  .list-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .toolbar{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
           padding:12px 14px;margin-bottom:14px}
  .views{display:flex;gap:4px}
  .view{display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;
        padding:7px 13px;border-radius:9px;cursor:pointer;background:transparent;
        border:1px solid transparent;color:var(--muted)}
  .view[aria-selected=true]{background:var(--bg);border-color:var(--line);color:var(--text)}
  .view .n{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--line);color:var(--muted)}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12px;
              font-weight:600;padding:6px 10px;border:0;border-radius:8px;cursor:pointer;
              background:transparent;color:var(--muted);transition:background .14s,color .14s}
  .seg button[aria-pressed=true]{background:var(--surface);color:var(--text);
                                 box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .seg .n{font-size:10px;opacity:.65}
  select.clinic{width:auto;min-width:190px;font-size:13px;padding:8px 10px}

  table{border-collapse:collapse;width:100%}
  thead th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
           color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--bg)}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  .ref{font:600 12px var(--mono);color:var(--muted)}
  .clinic-name{font-weight:650}
  .summary{max-width:520px;color:var(--muted);font-size:13px;overflow:hidden;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tier{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .tier.t0{background:var(--accent-soft);color:var(--accent)}
  .tier.t1{background:var(--warn-soft);color:var(--warn)}
  .tier.t2{background:var(--danger-soft);color:var(--danger)}
  .state{font-size:12px;font-weight:600;white-space:nowrap}
  .state.wait{color:var(--warn)} .state.ready{color:var(--accent)} .state.done{color:var(--info)}
  .empty{margin:0;padding:48px 20px;text-align:center;color:var(--muted)}

  /* ---- case view ---- */
  .back{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;
        color:var(--muted);background:transparent;border:0;cursor:pointer;padding:0;margin-bottom:14px}
  .back:hover{color:var(--text)}
  .case-head{display:grid;gap:8px;margin-bottom:16px}
  .refline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .case-head h1{font-size:26px;line-height:1.2}
  .case-head .lead{margin:0;font-size:16px}
  .glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;
          margin-bottom:16px}
  .g{padding:12px 14px}
  .g span{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .g b{font-size:15px}
  .g.warn b{color:var(--warn)} .g.ok b{color:var(--accent)} .g.bad b{color:var(--danger)}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
  .col{display:grid;gap:16px;min-width:0}
  .panel{padding:18px 20px}
  .panel h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.6px;
            text-transform:uppercase;color:var(--muted)}
  .panel h3:not(:first-child){margin-top:18px}
  .blockers{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .blockers li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:14px}
  .code{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;
        background:var(--info-soft);color:var(--info)}
  .rid{font:12px var(--mono);color:var(--muted);display:block;margin-top:2px}
  .resolved li{color:var(--muted)} .resolved .code{background:var(--accent-soft);color:var(--accent)}
  .banner{display:flex;gap:10px;align-items:center;padding:12px 15px;border-radius:12px;font-size:14px;
          background:var(--accent-soft)}
  .banner.wait{background:var(--warn-soft)} .banner.done{background:var(--info-soft)}
  .banner b{color:var(--accent);white-space:nowrap}
  .banner.wait b{color:var(--warn)} .banner.done b{color:var(--info)}

  .rule{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:10px}
  .rule:last-child{margin-bottom:0}
  .rule p{margin:2px 0 0;font-size:14px;color:var(--muted)}
  .rule.cited{border-left-color:var(--danger)} .rule.cited p{color:var(--text)}
  .rule-head{display:flex;align-items:center;gap:8px}
  .flag{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;
        border-radius:5px;background:var(--danger-soft);color:var(--danger)}

  .call{display:flex;flex-direction:column;position:sticky;top:14px;
        max-height:calc(100vh - var(--bar) - 40px);padding:0}
  .call-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .tab{font:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;
       background:transparent;border:1px solid transparent;color:var(--muted);transition:background .15s}
  .tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
  .call-meta{margin-left:auto;font-size:12px;color:var(--muted)}
  .call-body{overflow:auto;padding:14px 16px;min-height:260px}
  .fade{animation:fade .16s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  .turns{position:relative;display:grid}
  .turns::before{content:"";position:absolute;left:57px;top:10px;bottom:10px;width:1px;
                 background:var(--line)}
  .turn{display:grid;grid-template-columns:46px 22px minmax(0,1fr);gap:0 10px;padding:9px 0}
  .turn time{font:11px var(--mono);color:var(--muted);text-align:right;padding-top:4px}
  .turn .mark{position:relative;padding-top:8px}
  .turn .mark::before{content:"";position:absolute;left:5px;width:9px;height:9px;border-radius:50%;
                      background:var(--line);border:2px solid var(--surface)}
  .turn.agent .mark::before{background:var(--accent)}
  .turn b{display:block;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
          color:var(--muted);margin-bottom:1px}
  .turn.agent b{color:var(--accent)}
  .turn p{margin:0;font-size:14px}
  .turn.caller p{padding-left:11px;border-left:2px solid var(--line)}

  .ev{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;
      border-bottom:1px solid var(--line);font-size:14px}
  .ev:last-child{border-bottom:0}
  .ev time{font:12px var(--mono);color:var(--muted)}
  .ev .act{font:13px var(--mono)}
  .ev .detail{font-size:12px;color:var(--muted);display:block;word-break:break-word}
  .res{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;
       background:var(--accent-soft);color:var(--accent)}
  .res.refused{background:var(--danger-soft);color:var(--danger)}
  .res.reused,.res.duplicate{background:var(--warn-soft);color:var(--warn)}

  .decide{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
          border-top:1px solid var(--line);padding:12px 24px;display:flex;flex-direction:column;
          align-items:center;gap:8px;z-index:3}
  .decide .note{font-size:13px;color:var(--muted);text-align:center}
  .decide .buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .decide .btn{min-width:140px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .msg{font-size:13px;margin:0;min-height:18px;color:var(--muted)}
  .msg.ok{color:var(--accent)} .msg.err{color:var(--danger)}

  @media (max-width:1020px){
    .split{grid-template-columns:1fr}
    .call{position:static;max-height:none}
    .toolbar{grid-template-columns:1fr;gap:8px}
    select.clinic{width:100%}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="var(--accent)"/>
      <circle cx="11" cy="16" r="3" fill="var(--accent-ink)"/>
      <path d="M17 11a7 7 0 0 1 0 10" stroke="var(--accent-ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M21.5 7.5a12 12 0 0 1 0 17" stroke="var(--accent-ink)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/>
    </svg>AuthRelay</div>
  <nav>
    <a href="/">Caller</a>
    <a class="on" href="/review" aria-current="page">Reviewer queue</a>
  </nav>
  <div class="bar-right">
    <span class="badge">Synthetic demo</span>
  </div>
</header>

<main class="page">
  <section id="list-view">
    <div class="list-head"><h1>Reviewer queue</h1><span class="sub" id="count"></span></div>
    <div class="card toolbar">
      <div class="views" id="views" role="tablist"></div>
      <input id="search" type="search" placeholder="Search clinic, reference or summary">
      <div class="seg" id="filters" role="group" aria-label="Filter by tier"></div>
      <select class="clinic" id="clinic" aria-label="Filter by clinic"></select>
    </div>
    <div class="card"><div id="rows"></div></div>
  </section>

  <section id="case-view" hidden></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
// Every call rides on the session cookie the server set when it served this page.
const headers = () => ({ "Content-Type": "application/json" });

const TIERS = {
  tier_0_standard_review: ["t0", "Tier 0", "Standard review"],
  tier_1_priority_review: ["t1", "Tier 1", "Priority review"],
  tier_2_mandatory_human: ["t2", "Tier 2", "Mandatory human review"],
};
const CODES = {
  MISSING_DOC: "Missing document", CODE_MISMATCH: "Code mismatch", ELIGIBILITY: "Eligibility",
  POLICY_AMBIGUITY: "Policy ambiguity", CLINICAL: "Clinical",
};
const ICONS = {
  approve: "M20 6.5 9.5 17 4 11.5l1.4-1.4 4.1 4.1 9.1-9.1z",
  request_more: "M12 3a9 9 0 1 0 4.2 17l4.3 1-1.1-4.2A9 9 0 0 0 12 3zm-1 13h2v2h-2zm.2-8.6a3 3 0 0 1 3.6 3.2c-.2 1-1 1.5-1.5 2-.4.3-.6.7-.6 1.4h-2c0-1.3.4-2 1-2.5.6-.5 1.1-.8 1.1-1.4a1 1 0 0 0-2 0h-2a3 3 0 0 1 2.4-2.7z",
  deny: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2c1.6 0 3 .5 4.2 1.4L6.4 16.2A7 7 0 0 1 12 5zm0 14a7 7 0 0 1-4.2-1.4l9.8-9.8A7 7 0 0 1 12 19z",
};
const DECISIONS = [
  ["approve", "Approve", "primary", "The request meets the rules as they stand."],
  ["request_more", "Request more", "ghost", "Ask the provider for one more piece of evidence."],
  ["deny", "Deny", "danger-ghost", "The request cannot be authorised."],
];

let openItems = [], decidedItems = [], selected = null;
let view = "open", tab = "said", tier = "all", clinic = "all", query = "";
const calls = new Map();   // review_ref -> { turns, stored, events, rules }
const current = () => (view === "open" ? openItems : decidedItems);

// Built with the DOM and textContent, never by joining strings into markup: a summary is
// written by the agent from what a caller said, so treating it as markup would let a
// caller run script on the page where the reviewer token is typed.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "16");
  svg.setAttribute("height", "16");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[name]);
  path.setAttribute("fill", "currentColor");
  svg.append(path);
  return svg;
}

function ago(seconds) {
  if (!seconds) return "unknown";
  const mins = Math.max(0, Math.round((Date.now() / 1000 - seconds) / 60));
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const hours = Math.round(mins / 60);
  return hours < 24 ? hours + " h ago" : Math.round(hours / 24) + " d ago";
}
const clock = (s) => new Date(s * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const mmss = (s) => (s === null || s === undefined) ? ""
  : String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.round(s % 60)).padStart(2, "0");

function pill(node, count) {
  node.append(el("span", "n", String(count)));
  return node;
}

/* ================= list view ================= */
function visible() {
  const q = query.trim().toLowerCase();
  return current().filter((i) =>
    (tier === "all" || i.tier.startsWith(tier)) &&
    (clinic === "all" || i.provider_id === clinic) &&
    (!q || [i.review_ref, i.request_ref, i.provider, i.provider_id, i.summary, i.decided_by]
             .filter(Boolean).join(" ").toLowerCase().includes(q)));
}

function renderViews() {
  const box = $("views");
  box.replaceChildren();
  for (const [key, label, list] of [["open", "Open", openItems], ["decided", "Decided", decidedItems]]) {
    const b = pill(el("button", "view", label), list.length);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(view === key));
    b.addEventListener("click", () => {
      if (view === key) return;
      view = key; tier = "all"; clinic = "all";
      renderViews(); renderFilters(); renderRows();
    });
    box.append(b);
  }
  $("count").textContent = view === "open" ? `${openItems.length} waiting for a decision`
                                           : `${decidedItems.length} already settled`;
}

const TIER_FILTERS = [["all", "All"], ["tier_2", "T2"], ["tier_1", "T1"], ["tier_0", "T0"]];

function renderFilters() {
  const counts = { all: current().length };
  for (const i of current()) counts[i.tier.slice(0, 6)] = (counts[i.tier.slice(0, 6)] || 0) + 1;
  const box = $("filters");
  box.replaceChildren();
  for (const [key, label] of TIER_FILTERS) {
    const b = pill(el("button", "", label), counts[key] || 0);
    b.type = "button";
    b.setAttribute("aria-pressed", String(tier === key));
    b.addEventListener("click", () => { tier = key; renderFilters(); renderRows(); });
    box.append(b);
  }
  renderClinics();
}

function renderClinics() {
  const counts = new Map();
  for (const i of current()) {
    const key = i.provider_id || "unknown";
    const seen = counts.get(key) || { name: i.provider || key, n: 0 };
    seen.n += 1;
    counts.set(key, seen);
  }
  const box = $("clinic");
  box.replaceChildren();
  const all = el("option", "", `All clinics (${current().length})`);
  all.value = "all";
  box.append(all);
  for (const [key, { name, n }] of [...counts].sort((a, b) => a[1].name.localeCompare(b[1].name))) {
    const option = el("option", "", `${name} (${n})`);
    option.value = key;
    box.append(option);
  }
  if (![...counts.keys()].includes(clinic)) clinic = "all";
  box.value = clinic;
  box.disabled = counts.size < 2;
}

function stateCell(item) {
  if (item.decision) {
    return el("span", "state done", `${item.decision.replace("_", " ")} · ${item.decided_by || "reviewer"}`);
  }
  return item.transcript_ready ? el("span", "state ready", "Ready to decide")
                               : el("span", "state wait", "Awaiting transcript");
}

function renderRows() {
  const rows = visible();
  const host = $("rows");
  host.replaceChildren();
  if (!rows.length) {
    host.append(el("p", "empty", current().length ? "Nothing matches those filters."
      : view === "open" ? "No cases waiting for review." : "Nothing has been decided yet."));
    return;
  }
  const table = el("table");
  const head = table.createTHead().insertRow();
  for (const label of ["Clinic and case", "Tier", "State", "Handed over", ""]) {
    head.append(el("th", "", label));
  }
  const body = table.createTBody();
  for (const item of rows) {
    const [cls, short] = TIERS[item.tier] || ["t0", item.tier];
    const tr = body.insertRow();
    const who = tr.insertCell();
    who.append(el("div", "clinic-name", item.provider || item.provider_id || ""),
               el("div", "summary", item.summary),
               el("div", "ref", `${item.review_ref} · ${item.request_ref}`));
    tr.insertCell().append(el("span", "tier " + cls, short));
    tr.insertCell().append(stateCell(item));
    tr.insertCell().append(el("span", "sub", ago(item.created_at)));
    tr.insertCell().append(el("span", "sub hide-sm", "Open →"));
    tr.addEventListener("click", () => openCase(item.review_ref));
    body.append(tr);
  }
  host.append(table);
}

/* ================= case view ================= */
function blockerList(blockers, className) {
  const ul = el("ul", "blockers" + (className ? " " + className : ""));
  for (const b of blockers) {
    const li = el("li");
    const text = el("div");
    text.append(el("span", "", b.detail),
                el("span", "rid", `${b.rule_id} · policy ${b.policy_version}`));
    li.append(el("span", "code", CODES[b.code] || b.code), text);
    ul.append(li);
  }
  return ul;
}

function glance(item, rep, open, resolved) {
  const [, short, long] = TIERS[item.tier] || ["t0", item.tier, ""];
  const box = el("div", "glance");
  for (const [label, value, kind] of [
    ["Tier", short + " · " + long, item.tier.startsWith("tier_2") ? "bad"
                                 : item.tier.startsWith("tier_1") ? "warn" : "ok"],
    ["Open blockers", String(open.length), open.length ? "warn" : "ok"],
    ["Resolved on the call", String(resolved.length), resolved.length ? "ok" : ""],
    ["Policy in force", rep.policy_version || "n/a", ""],
    ["Call transcript", item.transcript_ready ? "Stored" : "Not yet",
     item.transcript_ready ? "ok" : "warn"],
  ]) {
    const tile = el("div", "card g" + (kind ? " " + kind : ""));
    tile.append(el("span", "", label), el("b", "", value));
    box.append(tile);
  }
  return box;
}

function rulesPanel(item) {
  const panel = el("section", "card panel");
  panel.id = "rules-panel";
  panel.append(el("h3", "", "Rules applied"), el("p", "sub", "Loading…"));
  return panel;
}

function paintRules(data) {
  const panel = $("rules-panel");
  if (!panel || !data) return;
  panel.replaceChildren(el("h3", "", "Rules applied"));
  const policy = data.rules;
  if (!policy || !policy.rules || !policy.rules.length) {
    panel.append(el("p", "sub", "No policy applies to this service date."));
    return;
  }
  const lead = el("p", "sub");
  lead.append(el("span", "", policy.procedure
      ? `${policy.procedure} · CPT ${policy.procedure_code}`
      : `CPT ${policy.procedure_code} is not in the schedule of benefits`),
    el("span", "rid", `Policy ${policy.policy_version}, in force from ${policy.effective_from}`));
  panel.append(lead);
  for (const rule of policy.rules) {
    const row = el("div", "rule" + (rule.cited ? " cited" : ""));
    const head = el("div", "rule-head");
    head.append(el("span", "rid", rule.rule_id));
    if (rule.cited) head.append(el("span", "flag", "this case failed it"));
    row.append(head, el("p", "", rule.text));
    panel.append(row);
  }
}

function renderCase() {
  const item = current().find((i) => i.review_ref === selected);
  const box = $("case-view");
  box.replaceChildren();
  if (!item) { showList(); return; }

  const rep = JSON.parse(item.report_json);
  const [cls, short, long] = TIERS[item.tier] || ["t0", item.tier, ""];
  const open = rep.blockers || [];
  const openIds = new Set(open.map((b) => b.rule_id));
  const resolved = (rep.original_blockers || []).filter((b) => !openIds.has(b.rule_id));

  const back = el("button", "back", "← All reviews");
  back.type = "button";
  back.addEventListener("click", showList);
  box.append(back);

  const head = el("div", "case-head fade");
  const refline = el("div", "refline");
  refline.append(el("span", "tier " + cls, `${short} · ${long}`), el("span", "ref", item.review_ref));
  if (item.decision) refline.append(stateCell(item));
  head.append(refline, el("h1", "", item.provider || item.request_ref),
              el("p", "lead", item.summary),
              el("p", "sub", `Request ${item.request_ref}` +
                             (item.provider_id ? ` · ${item.provider_id}` : "") +
                             ` · handed over ${ago(item.created_at)}`));
  box.append(head, glance(item, rep, open, resolved));

  const left = el("div", "col");
  const why = el("section", "card panel");
  why.append(el("h3", "", "Why this case is here"));
  why.append(open.length ? blockerList(open)
                         : el("p", "sub", "Nothing is outstanding. It was handed over complete."));
  if (resolved.length) {
    why.append(el("h3", "", "Resolved on the call"), blockerList(resolved, "resolved"));
  }
  if ((rep.similar_cases || []).length) {
    why.append(el("h3", "", "Similar earlier cases"), el("p", "sub", rep.similar_cases.join(", ")));
  }

  const banner = el("div", "banner" + (item.decision ? " done" : item.transcript_ready ? "" : " wait"));
  if (item.decision) {
    banner.append(el("b", "", item.decision.replace("_", " ") + "."),
                  el("span", "", `${item.decided_by || "A reviewer"} settled this ` +
                                 `${ago(item.decided_at)}. A case is decided once.`));
  } else {
    banner.append(el("b", "", item.transcript_ready ? "Ready to decide." : "Locked."),
                  el("span", "", item.transcript_ready
                    ? "The transcript is stored and its signature was verified."
                    : "Waiting for the post-call transcript. No decision can be recorded yet."));
  }
  left.append(banner, why, rulesPanel(item));

  const call = el("section", "card call");
  const callHead = el("div", "call-head");
  for (const [key, label] of [["said", "What was said"], ["did", "Audit trail"]]) {
    const b = el("button", "tab", label);
    b.type = "button";
    b.setAttribute("aria-selected", String(tab === key));
    b.addEventListener("click", () => {
      if (tab === key) return;
      tab = key;
      for (const other of callHead.querySelectorAll(".tab")) {
        other.setAttribute("aria-selected", String(other === b));
      }
      paintCall(item);
    });
    callHead.append(b);
  }
  const meta = el("span", "call-meta");
  meta.id = "call-meta";
  callHead.append(meta);
  const body = el("div", "call-body");
  body.id = "call-body";
  call.append(callHead, body);

  const split = el("div", "split");
  split.append(left, call);
  box.append(split);

  const bar = el("div", "decide");
  const msg = el("p", "msg");
  msg.id = "detail-msg";
  if (item.decision) {
    bar.append(el("span", "note", `Closed by ${item.decided_by || "a reviewer"}. ` +
                                  "The call and the trail stay on record."), msg);
  } else {
    bar.append(msg, el("span", "note", item.transcript_ready
      ? "Decided once, by a person. Every tier reaches a qualified employee."
      : "Locked until the call transcript is stored."));
    const buttons = el("div", "buttons");
    for (const [decision, label, style, hint] of DECISIONS) {
      const b = el("button", "btn " + style);
      b.type = "button";
      b.append(icon(decision), el("span", "", label));
      b.disabled = !item.transcript_ready;
      b.title = item.transcript_ready ? hint : "Available once the call transcript is stored";
      b.addEventListener("click", () => decide(item.review_ref, decision, label));
      buttons.append(b);
    }
    bar.append(buttons);
  }
  box.append(bar);
  paintCall(item);
}

function paintCall(item) {
  const body = $("call-body");
  const meta = $("call-meta");
  const data = calls.get(item.review_ref);
  if (!data) {
    body.replaceChildren(el("p", "sub", "Loading the call…"));
    loadCall(item);
    return;
  }
  paintRules(data);
  body.classList.remove("fade");
  void body.offsetWidth;
  body.classList.add("fade");

  if (tab === "said") {
    meta.textContent = data.turns.length ? `${data.turns.length} turns` : "";
    if (!data.turns.length) {
      body.replaceChildren(el("p", "sub", data.stored
        ? "The transcript holds no spoken turns." : "Waiting for the post-call transcript."));
      return;
    }
    const wrap = el("div", "turns");
    for (const t of data.turns) {
      const turn = el("div", "turn " + t.speaker);
      const said = el("div");
      said.append(el("b", "", t.speaker === "agent" ? "Assistant" : "Caller"),
                  el("p", "", t.text));
      turn.append(el("time", "", mmss(t.at)), el("span", "mark"), said);
      wrap.append(turn);
    }
    body.replaceChildren(wrap);
    return;
  }

  meta.textContent = data.events.length ? `${data.events.length} events · append-only` : "";
  if (!data.events.length) {
    body.replaceChildren(el("p", "sub", "Nothing recorded for this request yet."));
    return;
  }
  const trail = el("div");
  for (const e of data.events) {
    const row = el("div", "ev");
    const what = el("div");
    what.append(el("span", "act", e.action));
    if (e.detail) what.append(el("span", "detail", e.detail));
    row.append(el("time", "", clock(e.at)), what, el("span", "res " + e.result, e.result));
    trail.append(row);
  }
  body.replaceChildren(trail);
}

async function loadCall(item) {
  const [t, a, r] = await Promise.all([
    fetch(`/review/${item.review_ref}/transcript`, { headers: headers() }),
    fetch(`/audit/${item.request_ref}`, { headers: headers() }),
    fetch(`/review/${item.review_ref}/rules`, { headers: headers() }),
  ]);
  const transcript = t.ok ? await t.json() : { turns: [], stored: false };
  calls.set(item.review_ref, {
    turns: transcript.turns || [], stored: transcript.stored,
    events: a.ok ? await a.json() : [], rules: r.ok ? await r.json() : null,
  });
  if (selected === item.review_ref) paintCall(item);
}

/* ================= navigation ================= */
function showList() {
  selected = null;
  $("case-view").hidden = true;
  $("case-view").replaceChildren();
  $("list-view").hidden = false;
  window.scrollTo({ top: 0 });
}

function openCase(ref) {
  selected = ref;
  $("list-view").hidden = true;
  $("case-view").hidden = false;
  renderCase();
  window.scrollTo({ top: 0 });
}

function showNotice(text) {
  openItems = []; decidedItems = []; selected = null;
  $("rows").replaceChildren(el("p", "empty", text));
  $("views").replaceChildren();
  $("filters").replaceChildren();
  $("clinic").replaceChildren();
  $("count").textContent = "";
  $("case-view").hidden = true;
  $("list-view").hidden = false;
}

async function load() {
  const [q, h] = await Promise.all([
    fetch("/review/queue", { headers: headers() }),
    fetch("/review/history", { headers: headers() }),
  ]);
  if (!q.ok || !h.ok) {
    showNotice("This page has expired. Reload it.");
    return false;
  }
  openItems = await q.json();
  decidedItems = await h.json();
  calls.clear();
  renderViews(); renderFilters(); renderRows();
  if (selected && current().some((i) => i.review_ref === selected)) renderCase();
  else showList();
  return true;
}

async function decide(ref, decision, label) {
  const r = await fetch(`/review/${ref}/decision`, {
    method: "POST", headers: headers(),
    body: JSON.stringify({ decision, reviewer: "Reviewer" }),
  });
  if (!r.ok) {
    const msg = $("detail-msg");
    if (msg) { msg.textContent = `Not recorded: ${(await r.json()).detail}`; msg.className = "msg err"; }
    return;
  }
  selected = null;
  await load();
  const msg = el("p", "msg ok", `${label} recorded for ${ref}.`);
  $("list-view").prepend(msg);
  setTimeout(() => msg.remove(), 6000);
}

$("search").addEventListener("input", (e) => { query = e.target.value; renderRows(); });
$("clinic").addEventListener("change", (e) => { clinic = e.target.value; renderRows(); });

load();
</script>
</body>
